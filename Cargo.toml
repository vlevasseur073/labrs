[workspace]
resolver = "2"
members = [
    "crates/labrs",
    "crates/labrs-core",
    "crates/labrs-macros",
    "crates/labrs-server",
]
default-members = ["crates/labrs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/labrs/labrs"

[workspace.dependencies]
labrs-core = { path = "crates/labrs-core" }
labrs-macros = { path = "crates/labrs-macros" }
labrs-server = { path = "crates/labrs-server" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
which = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prettyplease = "0.2"
